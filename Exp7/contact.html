<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | My Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">MyPortfolio</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="skills.html">Skills</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <main class="container">
        <section class="contact-section">
            <div class="contact-header">
                <h1>Get In <span class="highlight">Touch</span></h1>
                <p>Have a question, a project proposal, or just want to talk low-level systems? Drop a message below!</p>
            </div>
            
            <form id="contactForm" class="contact-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" placeholder="Type your message here..." rows="5" required></textarea>
                </div>
                <button type="submit" class="btn-submit">Send Message</button>
                <div id="formResponse" class="form-response"></div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Kazi Naveel</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
